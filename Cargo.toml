[package]
name = "envexpand"
version = "1.0.0"
description = "A simple, tiny program to expand environment variables in a string."
edition = "2024"
readme = "README.txt"
license = "MIT"
authors = ["Nyeki <me@nyeki.dev>"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
shellexpand = "3.1.2"

[[bin]]
name = "ee"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
